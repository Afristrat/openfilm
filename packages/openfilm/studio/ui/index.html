<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFilm Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%228%206%2084%2092%22%20role%3D%22img%22%20aria-label%3D%22OpenFilm%22%3E%3Ctitle%3EOpenFilm%3C%2Ftitle%3E%3Cstyle%3E.i%7Bfill%3A%23111%7D%40media%20(prefers-color-scheme%3Adark)%7B.i%7Bfill%3A%23fff%7D%7D%3C%2Fstyle%3E%3Cmask%20id%3D%22gap%22%20maskUnits%3D%22userSpaceOnUse%22%20x%3D%220%22%20y%3D%220%22%20width%3D%22100%22%20height%3D%22100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M17%2012H37Q40%2012%2040%2015V27Q40%2029%2038.5%2030.5L31%2037V88Q31%2092%2027%2092Q23%2092%2023%2088V37L15.5%2030.5Q14%2029%2014%2027V15Q14%2012%2017%2012Z%22%20stroke%3D%22%23000%22%20stroke-width%3D%227%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fmask%3E%3Cg%20class%3D%22i%22%20mask%3D%22url(%23gap)%22%3E%3Crect%20x%3D%2222%22%20y%3D%2212%22%20width%3D%2264%22%20height%3D%2220%22%20rx%3D%225%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%2244%22%20width%3D%2247%22%20height%3D%2219%22%20rx%3D%225%22%2F%3E%3C%2Fg%3E%3Cpath%20class%3D%22i%22%20d%3D%22M17%2012H37Q40%2012%2040%2015V27Q40%2029%2038.5%2030.5L31%2037V88Q31%2092%2027%2092Q23%2092%2023%2088V37L15.5%2030.5Q14%2029%2014%2027V15Q14%2012%2017%2012Z%22%2F%3E%3C%2Fsvg%3E">
<script>
  /* the theme before the first paint, so the wrong one never flashes: dark unless the person chose another */
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('openfilm.theme') || 'dark'; } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  })();
</script>
<!-- Studio served to a browser: the host the desktop app would give (agent panel, media beside it), inline below: Studio serves only its page and /assets at the root -->
<script>
/*
 * The host Studio asks for (studio/ui/src/lib/host.ts, StudioHost version 1), for Studio served to a browser: the
 * desktop app gives Studio its chat panel and a place for the project's media; a browser has neither. This one gives
 * both, drawn in Studio's page: a panel on the left under the top bar, where the media pool opens above its composer.
 * Loaded before Studio's own script (index.html), and only where no app gave Studio a host already.
 * The agent's part talks to the project's agent on the server (studio/server/agent.mjs, deploy/agent-web/CONCEPTION.md).
 */
(function () {
  if (globalThis.openfilmHost) return;
  var KEY = 'openfilm.webHost.panel';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }
  /* the agent's part of the panel, at its bottom: the conversation and where to write; Studio's media above it */
  var COMPOSER = 320;
  var state = {
    open: saved.open !== false,
    width: saved.width || 380,
    assets: { open: saved.assetsOpen !== false, bottom: COMPOSER },
  };
  var listeners = [];
  var el = null;
  var ui = {};
  var keep = function () {
    try { localStorage.setItem(KEY, JSON.stringify({ open: state.open, width: state.width, assetsOpen: state.assets.open })); } catch (e) { /* private window */ }
  };
  var tell = function () {
    keep();
    draw();
    refresh();
    var shown = { open: state.open, width: state.open ? state.width : 0, preferredWidth: state.width, assets: { open: state.assets.open, bottom: COMPOSER } };
    listeners.forEach(function (l) { try { l(shown); } catch (e) { /* a listener's own failure */ } });
  };
  var bounds = null;
  var BORDER = 'var(--border,#2a2a2a)';
  function make(tag, css, text) {
    var n = document.createElement(tag);
    if (css) n.style.cssText = css;
    if (text != null) n.textContent = text;
    return n;
  }
  function draw() {
    if (!document.body) return;
    if (!el) {
      el = document.createElement('aside');
      el.setAttribute('data-studio-host-panel', '');
      el.setAttribute('aria-label', 'Agent');
      /* transparent above the agent's part: Studio draws the project's media there (panel.assets) */
      el.style.cssText = 'position:fixed;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box;pointer-events:none;'
        + 'color:var(--text,#e8e8e8);font:13px/1.45 system-ui,sans-serif';
      var box = make('div', 'pointer-events:auto;background:var(--bg,#151515);border-right:1px solid ' + BORDER + ';border-top:1px solid ' + BORDER
        + ';box-sizing:border-box;height:' + COMPOSER + 'px;padding:10px 12px;display:flex;flex-direction:column;gap:6px');
      box.setAttribute('data-composer', '');
      var head = make('div', 'display:flex;align-items:baseline;gap:8px');
      head.appendChild(make('div', 'font-weight:600', 'Agent du DGX'));
      ui.status = make('div', 'opacity:.65;font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis', '');
      head.appendChild(ui.status);
      /* the project's media, in the drawer above: Studio keeps it closed by default under a host (lib/workspaces.ts) */
      ui.media = make('button', 'border-radius:6px;border:1px solid var(--border,#333);background:transparent;color:inherit;padding:2px 8px;font:inherit;font-size:12px;cursor:pointer', 'Médias');
      ui.media.type = 'button';
      ui.media.addEventListener('click', function () { state.assets.open = !state.assets.open; tell(); });
      head.appendChild(ui.media);
      ui.log = make('div', 'flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px');
      ui.log.setAttribute('aria-live', 'polite');
      ui.input = make('textarea', 'width:100%;box-sizing:border-box;resize:none;border-radius:8px;border:1px solid var(--border,#333);background:transparent;color:inherit;padding:8px;font:inherit');
      ui.input.rows = 2;
      ui.input.setAttribute('aria-label', 'Message pour l’agent');
      ui.input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
      });
      var row = make('div', 'display:flex;gap:6px;justify-content:flex-end');
      ui.stop = make('button', 'border-radius:6px;border:1px solid var(--border,#333);background:transparent;color:inherit;padding:4px 10px;font:inherit;cursor:pointer', 'Arrêter');
      ui.stop.type = 'button';
      ui.stop.addEventListener('click', function () { say({ type: 'cancel' }); });
      ui.go = make('button', 'border-radius:6px;border:0;background:var(--accent,#3b82f6);color:#fff;padding:4px 12px;font:inherit;cursor:pointer', 'Envoyer');
      ui.go.type = 'button';
      ui.go.addEventListener('click', send);
      row.appendChild(ui.stop);
      row.appendChild(ui.go);
      box.appendChild(head);
      box.appendChild(ui.log);
      box.appendChild(ui.input);
      box.appendChild(row);
      el.appendChild(box);
      document.body.appendChild(el);
      refresh();
    }
    var top = 40;
    var b = bounds || { left: 0, top: top, width: state.width, height: window.innerHeight - top };
    el.style.display = state.open ? 'flex' : 'none';
    el.style.left = b.left + 'px';
    el.style.top = b.top + 'px';
    el.style.width = b.width + 'px';
    el.style.height = b.height + 'px';
  }

  /* the conversation with the project's agent (studio/server/agent.mjs): one socket per project open */
  var agent = { project: null, ws: null, ready: false, available: false, busy: false, model: null, reply: null, tools: {}, retry: 0, timer: null };
  function projectFromAddress() {
    var m = /^\/projects\/([\w-]+)/.exec(location.pathname);
    return m ? m[1] : null;
  }
  function refresh() {
    if (!ui.status) return;
    ui.media.setAttribute('aria-pressed', String(state.assets.open));
    ui.media.textContent = state.assets.open ? 'Masquer les médias' : 'Médias';
    var text = !agent.project ? 'Ouvrez un projet pour parler à l’agent.'
      : !agent.ready ? 'Connexion…'
      : !agent.available ? 'Aucun modèle n’est configuré sur ce serveur.'
      : agent.busy ? 'L’agent travaille…'
      : 'Prêt' + (agent.model ? ' · ' + agent.model : '');
    ui.status.textContent = text;
    var usable = Boolean(agent.project && agent.ready && agent.available);
    ui.input.disabled = !usable;
    ui.input.placeholder = usable ? 'Demandez à l’agent (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)' : text;
    ui.go.disabled = !usable || agent.busy;
    ui.stop.style.display = agent.busy ? '' : 'none';
  }
  function bubble(who, text) {
    var mine = who === 'person';
    var n = make('div', 'white-space:pre-wrap;word-break:break-word;border-radius:8px;padding:6px 8px;max-width:92%;'
      + (mine ? 'align-self:flex-end;background:var(--accent,#3b82f6);color:#fff' : who === 'error' ? 'background:rgba(220,38,38,.18);color:#fca5a5' : 'background:var(--panel,#1f1f1f)'), text);
    ui.log.appendChild(n);
    ui.log.scrollTop = ui.log.scrollHeight;
    return n;
  }
  function toolLine(title, status) {
    var n = make('div', 'font-size:12px;opacity:.7;padding-left:4px', '');
    setTool(n, title, status);
    ui.log.appendChild(n);
    ui.log.scrollTop = ui.log.scrollHeight;
    return n;
  }
  function setTool(n, title, status) {
    var mark = status === 'completed' ? '✓' : status === 'failed' ? '✗' : '…';
    n.textContent = mark + ' ' + (title || 'outil');
  }
  /* the references the agent writes for Studio (agents.mjs STUDIO_REFERENCES), as a person reads them */
  function clock(s) {
    var t = Math.max(0, Math.round(Number(s) || 0));
    var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), x = t % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0');
  }
  function readable(text) {
    return text.replace(/\[\[(\w+):([^\]]*)\]\]/g, function (all, kind, what) {
      if (kind === 'file') return '« ' + what.split('/').pop() + ' »';
      if (kind === 't') return clock(what);
      if (kind === 'range') { var r = what.split('-'); return clock(r[0]) + ' à ' + clock(r[1]); }
      if (kind === 'track') return 'piste ' + what;
      if (kind === 'clip') return 'le plan ' + what;
      return all;
    });
  }
  function heard(event) {
    if (event.kind === 'ready') { agent.ready = true; agent.available = event.available; agent.busy = event.busy; agent.model = event.model; agent.retry = 0; }
    else if (event.kind === 'turn') { agent.busy = true; agent.reply = null; agent.tools = {}; bubble('person', event.text); }
    else if (event.kind === 'history') {
      /* the conversation so far (the server keeps it with the project): a page opened again shows it */
      (event.entries || []).forEach(function (e) {
        if (e.kind === 'turn') bubble('person', e.text);
        else if (e.kind === 'reply') bubble('agent', readable(e.text));
        else if (e.kind === 'tool') agent.tools[e.id] = { node: toolLine(e.title, e.status), title: e.title };
        else if (e.kind === 'error') bubble('error', e.message);
        else if (e.kind === 'stopped') bubble('error', 'Tour arrêté.');
      });
    }
    else if (event.kind === 'busy') bubble('error', 'L’agent travaille déjà : attendez la fin de son tour, ou arrêtez-le.');
    else if (event.kind === 'error') { agent.busy = false; agent.reply = null; bubble('error', event.message || 'Erreur'); }
    else if (event.kind === 'done') { agent.busy = false; agent.reply = null; if (event.stopReason === 'cancelled') bubble('error', 'Tour arrêté.'); }
    else if (event.kind === 'update') {
      var u = event.update || {};
      if (u.sessionUpdate === 'agent_message_chunk' && u.content && u.content.type === 'text') {
        if (!agent.reply) { agent.reply = bubble('agent', ''); agent.reply.raw = ''; }
        agent.reply.raw += u.content.text;
        agent.reply.textContent = readable(agent.reply.raw);
        ui.log.scrollTop = ui.log.scrollHeight;
      } else if (u.sessionUpdate === 'tool_call') {
        agent.reply = null;
        agent.tools[u.toolCallId] = { node: toolLine(u.title, u.status), title: u.title };
      } else if (u.sessionUpdate === 'tool_call_update' && agent.tools[u.toolCallId]) {
        var t = agent.tools[u.toolCallId];
        if (u.title) t.title = u.title;
        setTool(t.node, t.title, u.status);
      }
    }
    refresh();
  }
  function say(message) {
    if (agent.ws && agent.ws.readyState === 1) agent.ws.send(JSON.stringify(message));
  }
  function send() {
    var text = ui.input.value.trim();
    if (!text || ui.go.disabled) return;
    say({ type: 'prompt', text: text });
    ui.input.value = '';
  }
  function connect() {
    if (agent.timer) { clearTimeout(agent.timer); agent.timer = null; }
    if (agent.ws) { agent.ws.onclose = null; agent.ws.close(); agent.ws = null; }
    agent.ready = false; agent.busy = false; agent.reply = null; agent.tools = {};
    if (ui.log) ui.log.textContent = '';
    refresh();
    if (!agent.project) return;
    var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/projects/' + encodeURIComponent(agent.project) + '/agent');
    agent.ws = ws;
    ws.onmessage = function (m) { try { heard(JSON.parse(m.data)); } catch (e) { /* not ours */ } };
    ws.onclose = function () {
      if (agent.ws !== ws) return;
      agent.ws = null; agent.ready = false; refresh();
      /* the server restarted or the network went: again, a little later each time */
      agent.retry = Math.min(agent.retry + 1, 6);
      agent.timer = setTimeout(connect, 1000 * agent.retry);
    };
  }
  function follow(id) {
    if (id === agent.project) return;
    agent.project = id;
    connect();
  }
  window.addEventListener('popstate', function () { follow(projectFromAddress()); });
  /* Studio changes its address itself (history.pushState): followed on each change of path */
  var lastPath = location.pathname;
  setInterval(function () { if (location.pathname !== lastPath) { lastPath = location.pathname; follow(projectFromAddress()); } }, 1000);

  window.addEventListener('resize', draw);
  document.addEventListener('DOMContentLoaded', function () { draw(); follow(projectFromAddress()); });
  globalThis.openfilmHost = {
    version: 1,
    name: 'OpenFilm (navigateur)',
    /* the project Studio shows: its agent is the one the panel talks to */
    projectChanged: function (project) { if (project && project.id) follow(project.id); },
    panel: {
      label: 'Agent',
      get open() { return state.open; },
      get width() { return state.open ? state.width : 0; },
      get preferredWidth() { return state.width; },
      get assets() { return { open: state.assets.open, bottom: COMPOSER }; },
      setOpen: function (open) { if (state.open === Boolean(open)) return; state.open = Boolean(open); tell(); },
      setAssetsOpen: function (open) { if (state.assets.open === Boolean(open)) return; state.assets.open = Boolean(open); tell(); },
      setWidth: function (width) { var w = Math.max(280, Math.min(720, Math.round(Number(width) || 380))); if (w === state.width) return; state.width = w; tell(); },
      setBounds: function (next) { bounds = next; draw(); },
      setPlacement: function () { /* the panel stays on the left, its media docked in it */ },
      onChange: function (listener) {
        listeners.push(listener);
        return function () { listeners = listeners.filter(function (l) { return l !== listener; }); };
      },
    },
  };
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
