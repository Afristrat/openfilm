<title>OpenFilm Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%228%206%2084%2092%22%20role%3D%22img%22%20aria-label%3D%22OpenFilm%22%3E%3Ctitle%3EOpenFilm%3C%2Ftitle%3E%3Cstyle%3E.i%7Bfill%3A%23111%7D%40media%20(prefers-color-scheme%3Adark)%7B.i%7Bfill%3A%23fff%7D%7D%3C%2Fstyle%3E%3Cmask%20id%3D%22gap%22%20maskUnits%3D%22userSpaceOnUse%22%20x%3D%220%22%20y%3D%220%22%20width%3D%22100%22%20height%3D%22100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M17%2012H37Q40%2012%2040%2015V27Q40%2029%2038.5%2030.5L31%2037V88Q31%2092%2027%2092Q23%2092%2023%2088V37L15.5%2030.5Q14%2029%2014%2027V15Q14%2012%2017%2012Z%22%20stroke%3D%22%23000%22%20stroke-width%3D%227%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fmask%3E%3Cg%20class%3D%22i%22%20mask%3D%22url(%23gap)%22%3E%3Crect%20x%3D%2222%22%20y%3D%2212%22%20width%3D%2264%22%20height%3D%2220%22%20rx%3D%225%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%2244%22%20width%3D%2247%22%20height%3D%2219%22%20rx%3D%225%22%2F%3E%3C%2Fg%3E%3Cpath%20class%3D%22i%22%20d%3D%22M17%2012H37Q40%2012%2040%2015V27Q40%2029%2038.5%2030.5L31%2037V88Q31%2092%2027%2092Q23%2092%2023%2088V37L15.5%2030.5Q14%2029%2014%2027V15Q14%2012%2017%2012Z%22%2F%3E%3C%2Fsvg%3E">
<script>
  /* the theme before the first paint, so the wrong one never flashes: dark unless the person chose another */
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('openfilm.theme') || 'dark'; } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  })();
</script>
<!-- Studio served to a browser: the host the desktop app would give (agent panel, media beside it), inline below: Studio serves only its page and /assets at the root -->
<script>
/*
 * The host Studio asks for (studio/ui/src/lib/host.ts, StudioHost version 1), for Studio served to a browser: the
 * desktop app gives Studio its chat panel and a place for the project's media; a browser has neither. This one gives
 * both, drawn in Studio's page: a panel on the left under the top bar, where the media pool opens above its composer.
 * Loaded before Studio's own script (index.html), and only where no app gave Studio a host already.
 * deploy/agent-web/CONCEPTION.md says where the agent itself comes in.
 */
(function () {
  if (globalThis.openfilmHost) return;
  var KEY = 'openfilm.webHost.panel';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }
  var COMPOSER = 132;
  var state = {
    open: saved.open !== false,
    width: saved.width || 380,
    assets: { open: saved.assetsOpen !== false, bottom: COMPOSER },
  };
  var listeners = [];
  var el = null;
  var keep = function () {
    try { localStorage.setItem(KEY, JSON.stringify({ open: state.open, width: state.width, assetsOpen: state.assets.open })); } catch (e) { /* private window */ }
  };
  var tell = function () {
    keep();
    draw();
    var shown = { open: state.open, width: state.open ? state.width : 0, preferredWidth: state.width, assets: { open: state.assets.open, bottom: COMPOSER } };
    listeners.forEach(function (l) { try { l(shown); } catch (e) { /* a listener's own failure */ } });
  };
  var bounds = null;
  function draw() {
    if (!document.body) return;
    if (!el) {
      el = document.createElement('aside');
      el.setAttribute('data-studio-host-panel', '');
      el.setAttribute('aria-label', 'Agent');
      /* transparent above the composer: Studio draws the project's media there (panel.assets) */
      el.style.cssText = 'position:fixed;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box;pointer-events:none;'
        + 'color:var(--text,#e8e8e8);font:13px/1.45 system-ui,sans-serif';
      el.innerHTML = '<div data-composer style="pointer-events:auto;background:var(--bg,#151515);border-right:1px solid var(--border,#2a2a2a);box-sizing:border-box;height:' + COMPOSER + 'px;padding:12px;border-top:1px solid var(--border,#2a2a2a)">'
        + '<div style="font-weight:600;margin-bottom:6px">Agent du DGX</div>'
        + '<textarea disabled rows="3" placeholder="La conversation avec l\'agent arrive à l\'étape suivante." '
        + 'style="width:100%;box-sizing:border-box;resize:none;border-radius:8px;border:1px solid var(--border,#333);background:transparent;color:inherit;padding:8px;font:inherit"></textarea></div>';
      document.body.appendChild(el);
    }
    var top = 40;
    var b = bounds || { left: 0, top: top, width: state.width, height: window.innerHeight - top };
    el.style.display = state.open ? 'flex' : 'none';
    el.style.left = b.left + 'px';
    el.style.top = b.top + 'px';
    el.style.width = b.width + 'px';
    el.style.height = b.height + 'px';
  }
  window.addEventListener('resize', draw);
  document.addEventListener('DOMContentLoaded', draw);
  globalThis.openfilmHost = {
    version: 1,
    name: 'OpenFilm (navigateur)',
    panel: {
      label: 'Agent',
      get open() { return state.open; },
      get width() { return state.open ? state.width : 0; },
      get preferredWidth() { return state.width; },
      get assets() { return { open: state.assets.open, bottom: COMPOSER }; },
      setOpen: function (open) { if (state.open === Boolean(open)) return; state.open = Boolean(open); tell(); },
      setAssetsOpen: function (open) { if (state.assets.open === Boolean(open)) return; state.assets.open = Boolean(open); tell(); },
      setWidth: function (width) { var w = Math.max(280, Math.min(720, Math.round(Number(width) || 380))); if (w === state.width) return; state.width = w; tell(); },
      setBounds: function (next) { bounds = next; draw(); },
      setPlacement: function () { /* the panel stays on the left, its media docked in it */ },
      onChange: function (listener) {
        listeners.push(listener);
        return function () { listeners = listeners.filter(function (l) { return l !== listener; }); };
      },
    },
  };
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
